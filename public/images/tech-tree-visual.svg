<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trunk-grad" x1="200" y1="360" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A" />
      <stop offset="1" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="node-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EC40A2" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Ground / Base Connections -->
  <circle cx="200" cy="360" r="6" fill="#16A34A" />
  <path d="M 200 360 L 200 200" stroke="url(#trunk-grad)" stroke-width="4" stroke-linecap="round" />

  <!-- Neural Branches -->
  <path d="M 200 300 C 150 280, 120 250, 110 210" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 200 270 C 250 250, 280 220, 290 180" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 200 230 C 160 200, 150 160, 140 130" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 200 210 C 240 180, 250 150, 260 110" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Sub-branches / Code Network Links -->
  <path d="M 110 210 Q 90 180 70 170" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4 4" />
  <path d="M 290 180 Q 320 150 330 130" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4 4" />
  <path d="M 140 130 Q 130 90 150 70" stroke="#EC40A2" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 260 110 Q 280 80 260 60" stroke="#EC40A2" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Tech Nodes (Glowing Circles) -->
  <circle cx="200" cy="180" r="14" fill="url(#node-grad)" />
  <circle cx="110" cy="210" r="10" fill="#22C55E" />
  <circle cx="290" cy="180" r="10" fill="#22C55E" />
  <circle cx="140" cy="130" r="11" fill="url(#node-grad)" />
  <circle cx="260" cy="110" r="11" fill="url(#node-grad)" />
  <circle cx="70" cy="170" r="8" fill="#A855F7" />
  <circle cx="330" cy="130" r="8" fill="#A855F7" />
  <circle cx="150" cy="70" r="9" fill="#EC40A2" />
  <circle cx="260" cy="60" r="9" fill="#EC40A2" />
  <circle cx="200" cy="90" r="16" fill="url(#node-grad)" />

  <!-- Floating Tech Data Bits -->
  <circle cx="180" cy="130" r="3" fill="#22C55E" />
  <circle cx="220" cy="140" r="4" fill="#EC40A2" />
  <circle cx="100" cy="120" r="3" fill="#A855F7" />
  <circle cx="300" cy="90" r="3" fill="#22C55E" />
</svg>
